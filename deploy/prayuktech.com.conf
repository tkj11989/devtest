# Nginx server block for prayuktech.com (static site).
# Adds a NEW site only; it does not touch ExamSuit or VartiQ configs.
server {
    listen 80;
    listen [::]:80;
    server_name prayuktech.com www.prayuktech.com;

    root /var/www/prayuktech.com;
    index index.html;

    # Basic hardening and caching
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
