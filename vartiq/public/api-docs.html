<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VartiQ API</title>
  <link rel="stylesheet" href="/api/docs/assets/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fff; }
    .topbar-note {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(120deg, #061639, #0A3A7A);
      border-bottom: 3px solid #FE730F;
      color: #fff;
      padding: 10px 16px;
    }
    .topbar-note a { color: #fff; }
    .topbar-note code { background: rgba(255, 255, 255, .18); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="topbar-note">
    VartiQ REST API · <a href="/api/v1/openapi.json">openapi.json</a> ·
    Click <b>Authorize</b> and paste a session token or an API key (<code>cak_…</code>).
    Create API keys and webhooks in the app under <b>Profile → Developer</b>. · <a href="/">Back to the app</a>
  </div>
  <div id="swagger"></div>
  <script src="/api/docs/assets/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/api/v1/openapi.json',
      dom_id: '#swagger',
      deepLinking: true,
      persistAuthorization: true,
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
